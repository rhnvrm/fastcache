name: Run Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            go.sum
            stores/redis/go.sum
            stores/goredis/go.sum
            tests/go.sum
      - name: Test all workspace modules
        run: go test -race -cover ./... ./stores/redis/... ./stores/goredis/... ./tests/...
      - name: Verify each module independently
        env:
          GOWORK: 'off'
        run: |
          for module in . stores/redis stores/goredis tests; do
            (cd "$module" && go mod tidy -diff)
          done
      - name: Verify library modules independently
        env:
          GOWORK: 'off'
        run: |
          for module in . stores/redis stores/goredis; do
            (cd "$module" && go test ./...)
          done
